---
- name: Assert the remote development role is bounded
  ansible.builtin.assert:
    that:
      - device_role == 'disposable-development-compute'
      - canonical_name == 'dev-netcup'
      - ansible_facts.os_family == 'Debian'
      - remote_development_admin_user is match('^[a-z_][a-z0-9_-]*$')
      - remote_development_admin_user != 'root'
    fail_msg: Refusing to apply the Netcup development profile to another role.

- name: Install remote development and container packages
  ansible.builtin.apt:
    name:
      - build-essential
      - cmake
      - docker-compose
      - docker.io
      - extrepo
      - fzf
      - gh
      - gnupg
      - bat
      - maven
      - ninja-build
      - nftables
      - pkg-config
      - python3-venv
      - shellcheck
      - zoxide
      - zsh
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Allow the named development administrator to use Docker
  ansible.builtin.user:
    name: "{{ remote_development_admin_user }}"
    groups: docker
    append: true
  when: not ansible_check_mode

- name: Bound Docker daemon logs and preserve running containers across daemon upgrades
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "live-restore": true,
        "log-driver": "json-file",
        "log-opts": {
          "max-file": "3",
          "max-size": "25m"
        }
      }
  notify: Restart Docker

- name: Install the disposable Docker cleanup service
  ansible.builtin.copy:
    dest: /etc/systemd/system/dev-netcup-docker-prune.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Remove week-old unused Docker development artifacts
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker system prune --force --filter until=168h
      NoNewPrivileges=true

- name: Install the disposable Docker cleanup timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/dev-netcup-docker-prune.timer
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Weekly cleanup of unused Docker development artifacts

      [Timer]
      OnCalendar=weekly
      RandomizedDelaySec=2h
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Enable the disposable Docker cleanup timer
  ansible.builtin.systemd_service:
    name: dev-netcup-docker-prune.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Inspect mise package availability
  ansible.builtin.command: apt-cache policy mise
  register: mise_policy
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Enable the extrepo-managed mise repository
  ansible.builtin.command: extrepo enable mise
  when:
    - not ansible_check_mode
    - "'Candidate: (none)' in mise_policy.stdout or 'mise:' not in mise_policy.stdout"
  register: mise_repo
  changed_when: mise_repo.rc == 0

- name: Refresh apt metadata after enabling mise
  ansible.builtin.apt:
    update_cache: true
  when:
    - not ansible_check_mode
    - mise_repo is changed

- name: Install mise from its extrepo-managed repository
  ansible.builtin.apt:
    name: mise
    state: present
  when: not ansible_check_mode

- name: Create the development checkout root
  ansible.builtin.file:
    path: "{{ remote_development_checkout_root }}"
    state: directory
    owner: "{{ remote_development_admin_user }}"
    group: "{{ remote_development_admin_user }}"
    mode: '0750'

- name: Activate mise for interactive Bash sessions
  ansible.builtin.blockinfile:
    path: "/home/{{ remote_development_admin_user }}/.bashrc"
    owner: "{{ remote_development_admin_user }}"
    group: "{{ remote_development_admin_user }}"
    mode: '0644'
    marker: '# {mark} MODULO MISE'
    block: |
      if command -v mise >/dev/null 2>&1; then
        eval "$(mise activate bash)"
      fi

- name: Record the disposable development boundary
  ansible.builtin.copy:
    dest: /etc/motd.d/70-development-boundary
    owner: root
    group: root
    mode: '0644'
    content: |
      This is disposable development compute.
      Production credentials and authoritative personal data are forbidden.
      Source belongs in Git; non-regenerable state requires an explicit backup.

- name: Record the disposable backup scope
  ansible.builtin.copy:
    dest: /etc/personal-backup/DEV-NETCUP-SCOPE
    owner: root
    group: root
    mode: '0600'
    content: |
      This host currently contains no authoritative state.
      Git is the authority for source; package, build and container data are regenerable caches.
      Do not store production credentials or unique personal data here.
      Before introducing non-regenerable state, provision an encrypted off-host Restic target,
      document retention, and complete a restore test.

- name: Create the development-host health state directory
  ansible.builtin.file:
    path: /var/lib/dev-netcup-health
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install the development-host health probe
  ansible.builtin.copy:
    dest: /usr/local/sbin/dev-netcup-health
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/sh
      set -eu

      PATH=/usr/sbin:/usr/bin:/sbin:/bin
      state_dir=/var/lib/dev-netcup-health
      output="$state_dir/last.json"
      temporary="$state_dir/.last.json.$$"
      zerotier_cli=/usr/sbin/zerotier-cli
      network_id='{{ private_network_id }}'
      push_url_file='{{ remote_development_health_push_url_file }}'
      disk_percent="$(df -P / | awk 'NR == 2 { gsub(/%/, "", $5); print $5 }')"
      ssh_state="$(systemctl is-active ssh 2>/dev/null || true)"
      docker_state="$(systemctl is-active docker 2>/dev/null || true)"
      zerotier_state="$(systemctl is-active zerotier-one 2>/dev/null || true)"
      admin_firewall_state="$(systemctl is-active {{ remote_development_admin_firewall_unit }} 2>/dev/null || true)"
      network_state=NOT_JOINED
      if [ -x "$zerotier_cli" ]; then
        network_state="$($zerotier_cli -j listnetworks 2>/dev/null \
          | jq -r --arg id "$network_id" '.[] | select(.nwid == $id) | .status' \
          | head -n 1 || true)"
        [ -n "$network_state" ] || network_state=NOT_JOINED
      fi
      healthy=true
      [ "$ssh_state" = active ] || healthy=false
      [ "$docker_state" = active ] || healthy=false
      [ "$zerotier_state" = active ] || healthy=false
      [ "$admin_firewall_state" = active ] || healthy=false
      [ "$network_state" = OK ] || healthy=false
      [ "$disk_percent" -lt {{ remote_development_disk_warning_percent }} ] || healthy=false

      install -d -m 0700 "$state_dir"
      jq -n \
        --arg checkedAt "$(date --iso-8601=seconds)" \
        --arg ssh "$ssh_state" \
        --arg docker "$docker_state" \
        --arg zerotier "$zerotier_state" \
        --arg adminFirewall "$admin_firewall_state" \
        --arg network "$network_state" \
        --argjson diskPercent "$disk_percent" \
        --argjson healthy "$healthy" \
        '{checkedAt: $checkedAt, healthy: $healthy, services: {ssh: $ssh, docker: $docker, zerotier: $zerotier, adminFirewall: $adminFirewall}, zerotierNetwork: $network, rootDiskPercent: $diskPercent}' \
        > "$temporary"
      chmod 0600 "$temporary"
      mv "$temporary" "$output"

      if [ -r "$push_url_file" ]; then
        push_url="$(tr -d '\r\n' < "$push_url_file")"
        push_status=down
        [ "$healthy" = true ] && push_status=up
        push_msg="dev-netcup-health healthy=$healthy disk=${disk_percent}% zerotier=$network_state"
        if ! curl -fsS --max-time 10 --get \
          --data-urlencode "status=$push_status" \
          --data-urlencode "msg=$push_msg" \
          "$push_url" >/dev/null 2>&1; then
          logger -p daemon.warning -t dev-netcup-health "Uptime Kuma push failed; inspect $output"
        fi
      fi

      if [ "$healthy" != true ]; then
        logger -p daemon.warning -t dev-netcup-health "development host health check is degraded; inspect $output"
        exit 1
      fi

- name: Install the development-host health service
  ansible.builtin.copy:
    dest: /etc/systemd/system/dev-netcup-health.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Check Netcup development host health
      After=docker.service zerotier-one.service {{ remote_development_admin_firewall_unit }}

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/dev-netcup-health
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectHome=true
      ProtectSystem=strict
      ReadWritePaths=/var/lib/dev-netcup-health

- name: Install the development-host health timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/dev-netcup-health.timer
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Periodically check Netcup development host health

      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=15min
      RandomizedDelaySec=1min
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Enable the development-host health timer
  ansible.builtin.systemd_service:
    name: dev-netcup-health.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Install the private-access-only firewall policy
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
    validate: nft -c -f %s
    content: |
      # Managed by Modulo infra/personal for dev-netcup.
      flush ruleset

      table inet filter {
        chain input {
          type filter hook input priority filter; policy drop;
          ct state established,related accept
          ct state invalid drop
          iifname "lo" accept
          ip protocol icmp accept
          ip6 nexthdr ipv6-icmp accept
          udp dport 9993 accept
          iifname "zt*" tcp dport 22 accept
        }

        chain forward {
          type filter hook forward priority filter; policy drop;
        }

        chain output {
          type filter hook output priority filter; policy accept;
        }
      }
  when: remote_development_private_ssh_only | bool
  notify: Enable private-access firewall
