# Loaded from classpath:/config/ so it layers over the main application.properties
# instead of shadowing it (a test-classes application.properties at the classpath
# root would hide the main one).
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# Entities map to the "application" schema (@Table(schema="application")); let
# Hibernate create that schema in H2 instead of failing with "Schema APPLICATION
# not found".
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=false

# Keep test output small: the base configuration logs Spring Security, Spring
# Web, actuator and com.modulo at DEBUG, and every test context would repeat it.
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot.actuate=WARN
logging.level.com.modulo=INFO
logging.level.org.hibernate.SQL=WARN

# Use schema.sql for additional table creation
spring.datasource.initialization-mode=always
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Disable Azure Blob Storage for tests
azure.storage.connection-string=UseDevelopmentStorage=true
azure.storage.container-name=test-attachments
azure.cdn.endpoint=https://test-cdn.azureedge.net
# Don't try to reach a storage emulator when a test boots a non-test profile.
azure.storage.initialize-container=false
# H2 application tests do not run PostgreSQL DDL; SchemaMigrationTest covers Flyway.
spring.flyway.enabled=false

# Tests run the actuator on the application port so MockMvc reaches it
# (the base file puts it on 8081). Empty means "same as server.port".
management.server.port=
# Keep the code default for the OAuth-migration dual-auth switch in tests.
modulo.auth.dual-auth-enabled=false
