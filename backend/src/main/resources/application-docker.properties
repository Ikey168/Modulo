# docker profile: every Compose deployment (docker-compose.yml, deploy/oci, deploy/pi).
# PostgreSQL with Flyway-owned schema; the datasource comes from the environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false

# Versioned PostgreSQL schema; existing databases require explicit validated adoption.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=false

management.endpoints.web.exposure.include=health,info,metrics

# Deployments set MODULO_SECURITY_JWT_SECRET, MODULO_SECURITY_API_KEY and
# MODULO_SECURITY_ENCRYPTION_KEY; the short names below are older aliases.
modulo.security.jwt-secret=${MODULO_JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWZvci12YWxpZGF0aW9uLXRlc3RpbmctMTIzNDU2Nzg5MA==}
modulo.security.api-key=${MODULO_API_KEY:mod_abcdef1234567890}
modulo.security.encryption-key=${MODULO_ENCRYPTION_KEY:docker-encryption-key}

modulo.integrations.blockchain.network=${BLOCKCHAIN_NETWORK:mainnet}
modulo.integrations.blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://localhost:8545}
modulo.integrations.ipfs.node-url=${IPFS_NODE_URL:http://ipfs:5001}
modulo.integrations.ipfs.gateway-url=${IPFS_GATEWAY_URL:http://ipfs:8080}
modulo.integrations.ipfs.enabled=${IPFS_ENABLED:true}
