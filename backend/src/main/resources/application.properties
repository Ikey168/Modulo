# Base configuration for every profile.
#
# This is the only base file. Profiles: docker (Compose, OCI, Pi), dev (native
# development against docker-compose.dev.yml) and test (src/test/resources).
# Any key can be overridden from the environment with Spring's relaxed binding,
# for example MODULO_SECURITY_JWT_SECRET for modulo.security.jwt-secret.
# docs/reference/configuration.md lists every key the code reads.

# --- Server ---------------------------------------------------------------
server.port=8080
# Controllers already map /api/...; every Compose deployment and the dev profile
# set this to "/". It must not be blank (ServerProperties validation).
server.servlet.context-path=/api
server.forward-headers-strategy=framework
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# Multipart bounds: attachments are limited to 10 MB by the application and PDF tools to
# 25 MB per file (#495); Spring's 1 MB default would reject both before they reach it.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# Keep metrics and retention responsive while a durable workflow dispatcher is busy.
spring.task.scheduling.pool.size=4

# --- Management / actuator ------------------------------------------------
management.server.port=8081
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=*
management.endpoints.web.cors.allowed-origins=http://localhost:3000
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99
management.metrics.tags.application=modulo-backend
management.metrics.tags.version=1.0.0

# --- gRPC and API docs ----------------------------------------------------
grpc.server.port=9090
grpc.server.enable-reflection=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method

# --- Database -------------------------------------------------------------
# Without a profile the backend runs on in-memory H2 with Hibernate DDL, for quick
# local work only. The docker and dev profiles switch to PostgreSQL with Flyway.
spring.datasource.url=jdbc:h2:mem:modulodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Entities are mapped to the "application" schema (@Table(schema="application")).
# Let Hibernate create that schema on H2; PostgreSQL profiles turn this off.
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/postgresql
spring.flyway.table=modulo_schema_history
spring.flyway.default-schema=public
spring.flyway.schemas=public,application
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# --- Security -------------------------------------------------------------
# Dev-only placeholders that satisfy ModuloProperties validation
# (jwt-secret: base64 [A-Za-z0-9+/=]{32,}; api-key: mod_ + 16+ alphanumeric).
# OVERRIDE THESE IN PRODUCTION via MODULO_SECURITY_* env vars.
modulo.security.jwt-secret=ZGV2LW9ubHktSldULXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbg==
modulo.security.jwt-expiration-seconds=3600
modulo.security.api-key=mod_devLocalApiKeyChangeMe123456
modulo.security.encryption-key=default-encryption-key-32-chars-long
modulo.security.enable-csrf=true
modulo.security.enable-cors=true
modulo.security.max-login-attempts=3
modulo.security.account-lockout-duration-seconds=900

# OAuth provider migration
modulo.auth.dual-auth-enabled=true
modulo.auth.default-provider=KEYCLOAK
modulo.auth.migration-grace-period-days=30

# --- Application features and limits (ModuloProperties) --------------------
modulo.features.enable-blockchain=true
modulo.features.enable-websockets=true
modulo.features.enable-grpc=true
modulo.features.enable-offline-mode=true
modulo.features.enable-plugin-system=true
modulo.features.enable-file-upload=true
modulo.features.enable-search=true
modulo.features.enable-notifications=true
modulo.performance.max-file-size-mb=10
modulo.performance.thread-pool-size=10
modulo.performance.request-timeout-ms=30000
modulo.performance.cache-size=1000
modulo.performance.cache-ttl-seconds=3600

# --- Blueprints and plugins -----------------------------------------------
# action.code.execute runs only in QuickJS-on-WASM. The retired Rhino engine is
# intentionally not a valid configuration value (#401).
modulo.blueprint.sandbox=wasm
# NATS bridge for external plugin workloads (#391). Off by default; when on but
# NATS is unreachable the core degrades (bridging suspends, in-JVM events continue).
modulo.plugins.broker.enabled=false
modulo.plugins.broker.url=nats://nats:4222

# --- Files and attachments ------------------------------------------------
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:modulostorage}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.account-key=${AZURE_STORAGE_ACCOUNT_KEY:}
azure.storage.use-managed-identity=${AZURE_STORAGE_USE_MANAGED_IDENTITY:true}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:attachments}
azure.storage.cdn-endpoint=${AZURE_CDN_ENDPOINT:}
azure.storage.max-file-size=${AZURE_STORAGE_MAX_FILE_SIZE:10485760}
azure.storage.allowed-content-types=${AZURE_STORAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/gif,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document}

# --- Integrations ---------------------------------------------------------
modulo.integrations.blockchain.network=localhost
modulo.integrations.blockchain.rpc-url=http://localhost:8545
modulo.integrations.blockchain.gas-limit=8000000
modulo.integrations.blockchain.gas-price-wei=20000000000
modulo.integrations.ipfs.node-url=http://localhost:5001
modulo.integrations.ipfs.gateway-url=http://localhost:8080
modulo.integrations.ipfs.enabled=true
modulo.integrations.ipfs.timeout-ms=30000
modulo.integrations.ipfs.max-file-size-mb=50
modulo.integrations.external.api-timeout-ms=10000
modulo.integrations.external.max-retries=3
modulo.integrations.external.retry-delay-ms=2000

blockchain.network.rpc-url=http://localhost:8545
blockchain.network.chain-id=31337
blockchain.contract.note-registry-address=0x0165878A594ca255338adfa4d48449f69242Eb8F
blockchain.contract.modulo-token-address=0x5FbDB2315678afecb367f032d93F642f64180aa3
blockchain.contract.note-monetization-address=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
blockchain.gas.price=20000000000
blockchain.gas.limit=3000000

# Base64 AES-256 key for server-held service credentials (feeds, CalDAV, ntfy, metadata; #495).
# Without it the credential endpoints answer 503 and the services that need credentials say so.
modulo.remote.credential-key=${MODULO_REMOTE_CREDENTIAL_KEY:}
# Let server-side adapters reach private/local addresses (self-hosted services next to Modulo).
# Off by default: when on, any signed-in user can make the server request internal hosts.
modulo.remote.allow-private-networks=${MODULO_REMOTE_ALLOW_PRIVATE_NETWORKS:false}
# Praxis control plane (#525). Modulo is one delegating client: mutual TLS with a
# certificate from the internal CA, plus a bearer token. Only file paths are set here;
# the token itself comes from PRAXIS_MODULO_TOKEN or a mounted token file.
modulo.praxis.enabled=${MODULO_PRAXIS_ENABLED:false}
modulo.praxis.base-url=${MODULO_PRAXIS_URL:}
modulo.praxis.ca-file=${MODULO_PRAXIS_CA_FILE:}
modulo.praxis.client-cert-file=${MODULO_PRAXIS_CLIENT_CERT_FILE:}
modulo.praxis.client-key-file=${MODULO_PRAXIS_CLIENT_KEY_FILE:}
modulo.praxis.token-file=${MODULO_PRAXIS_TOKEN_FILE:}
# Noesis knowledge engine (action.noesis.brief blueprint node).
noesis.brief.url=${NOESIS_BRIEF_URL:http://localhost:8012}

# --- Observability --------------------------------------------------------
# OpenTelemetryConfig builds the tracer by hand and reads only these keys.
otel.service.name=modulo-backend
otel.service.version=1.0.0
otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.actuate=DEBUG
logging.level.com.modulo=DEBUG
logging.level.org.springframework.security.oauth2=TRACE

# --- Chaos engineering (testing only) -------------------------------------
modulo.chaos.enabled=false
modulo.chaos.opa-failure-rate=0.0
modulo.chaos.keycloak-failure-rate=0.0
modulo.chaos.network-delay-ms=0
modulo.chaos.database-failure-rate=0.0
