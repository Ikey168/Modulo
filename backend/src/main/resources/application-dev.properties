# dev profile: the backend runs natively (mvn spring-boot:run) against the
# backing services in docker-compose.dev.yml (PostgreSQL on 5432, Keycloak on 8180).
# The Vite dev server proxies /api and /ws to http://localhost:8080.
server.servlet.context-path=/

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/modulodb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=false

# Trust bearer tokens from the dev Keycloak realm.
modulo.security.keycloak.jwk-set-uri=http://localhost:8180/realms/modulo/protocol/openid-connect/certs
modulo.security.keycloak.issuer-uri=http://localhost:8180/realms/modulo

# Traces go to the optional Jaeger service (--profile observability).
otel.service.name=modulo-backend-dev
otel.service.version=1.0.0-dev

logging.level.io.opentelemetry=DEBUG
