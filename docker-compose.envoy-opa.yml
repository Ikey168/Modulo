version: '3.8'

services:
  envoy:
    image: envoyproxy/envoy:v1.28-latest
    ports:
      - "8080:8080"
      - "9901:9901"  # Admin interface
    volumes:
      - ./infra/envoy/envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - opa
      - backend
    networks:
      - modulo-network

  opa:
    image: openpolicyagent/opa:latest-envoy
    ports:
      - "8181:8181"  # REST API
      - "9191:9191"  # gRPC for Envoy
    volumes:
      - ./infra/opa:/policies
    command: 
      - "run"
      - "--server"
      - "--config-file=/policies/config.yaml"
      - "/policies"
    networks:
      - modulo-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # No profile: in-memory H2. Bearer tokens are checked against this issuer,
      # whose JWK set is discovered on first use.
      - MODULO_SECURITY_KEYCLOAK_ISSUER_URI=${MODULO_SECURITY_KEYCLOAK_ISSUER_URI:-http://localhost:8080/auth/realms/modulo}
    ports:
      - "8081:8080"  # Direct backend access (bypassing Envoy)
    networks:
      - modulo-network

networks:
  modulo-network:
    driver: bridge
