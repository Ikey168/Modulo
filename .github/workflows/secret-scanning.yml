name: Secret Scanning

# Scans the commits a pull request or push introduces with the Gitleaks CLI and
# .gitleaks.toml. It fails when a new commit adds something that looks like a secret.
#
# Repaired in #544. Changes from the original (which never ran because the file was not
# valid YAML):
#   - Uses the Gitleaks CLI instead of gitleaks/gitleaks-action, which needs a paid
#     GITLEAKS_LICENSE secret for repositories owned by an organization.
#   - Scans only the new commits, not the whole history or tree on a schedule: the tree
#     still holds known development defaults (see docs/operations/security-testing.md),
#     so a full scan could never pass.
#   - Dropped the SARIF upload and PR comment, which need write permissions that
#     pull requests from forks do not get. Findings are printed (redacted) in the log.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.28.0

jobs:
  gitleaks:
    name: Run Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Select commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${SHA}"
          else
            range="-1 ${SHA}"
          fi
          echo "Scanning commits: $range"
          echo "log_opts=$range" >> "$GITHUB_OUTPUT"

      - name: Run Gitleaks
        run: |
          gitleaks detect --source . --config .gitleaks.toml --redact --verbose \
            --log-opts="${{ steps.range.outputs.log_opts }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "# Secret scanning"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "No secrets detected in commits ${{ steps.range.outputs.log_opts }}."
            else
              echo "Gitleaks reported possible secrets. See the job log (values are redacted)."
              echo "Treat any real finding as compromised and rotate it; see docs/operations/security-testing.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
