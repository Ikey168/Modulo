name: Multi-Architecture Docker Build
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package*.json'
      - '.node-version'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
permissions:
  contents: read
concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false
jobs:
  images:
    if: github.event_name == 'pull_request' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${REPOSITORY,,}/$COMPONENT" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_run'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.component == 'frontend' && '.' || './backend' }}
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'workflow_run' }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'workflow_run'
      - name: Sign and verify immutable image
        if: github.event_name == 'workflow_run'
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/docker-build.yml@refs/heads/main
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify "$IMAGE" --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com
          printf '%s\n' "$IMAGE" > image-${{ matrix.component }}.txt
          printf '%s\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: image-${{ matrix.component }}
          path: image-${{ matrix.component }}.txt
          retention-days: 90
