name: Approval signature vectors
on:
  pull_request:
    paths:
      - 'shared/approval/**'
      - 'scripts/verify-approval.mjs'
      - 'scripts/*audit-report.mjs'
      - 'scripts/*evidence-bundle.py'
      - 'backend/src/main/java/com/modulo/blueprint/approval/**'
      - '.github/workflows/approval-signatures.yml'
jobs:
  offline-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test shared/approval/verification.test.mjs
      - run: python3 scripts/test-evidence-bundle.py
      - run: node --test scripts/test-audit-report.mjs
