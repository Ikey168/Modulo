name: Test Image Signing

# Static checks for the Kyverno image-signing policies, their helper scripts and the
# supply-chain documentation.
#
# Repaired in #544 (the file was not valid YAML, so nothing ran). Removed:
#   - "Test Policy Logic": `kubectl apply --dry-run=client` needs a reachable API server,
#     and the step only checked that two Pod manifests it wrote itself were well formed.
#   - "Integration Test with Kind": it pinned a Kyverno chart version that does not exist
#     (`v1.8.5` is the app version, not the chart version), accepted either outcome of the
#     unsigned-image test, and the policies name the `docker-build.yml` signer rather than
#     `signed-production.yml`, which signs current images (see
#     docs/operations/releases-and-supply-chain.md), so enforcement could not be tested
#     meaningfully.

on:
  push:
    branches: [main]
    paths:
      - 'k8s/policies/**'
      - 'scripts/setup-image-signing.sh'
      - 'scripts/validate-image-signing.sh'
      - 'docs/operations/releases-and-supply-chain.md'
      - '.github/workflows/test-image-signing.yml'
  pull_request:
    paths:
      - 'k8s/policies/**'
      - 'scripts/setup-image-signing.sh'
      - 'scripts/validate-image-signing.sh'
      - 'docs/operations/releases-and-supply-chain.md'
      - '.github/workflows/test-image-signing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-policies:
    name: Validate Image Signing Policies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Kyverno policy YAML
        run: |
          shopt -s nullglob
          policies=(k8s/policies/*.yaml)
          if [ ${#policies[@]} -eq 0 ]; then
            echo "No policies found in k8s/policies"
            exit 1
          fi
          for policy in "${policies[@]}"; do
            python3 - "$policy" <<'PY'
          import sys, yaml
          path = sys.argv[1]
          docs = [d for d in yaml.safe_load_all(open(path)) if d]
          for d in docs:
              assert d.get("apiVersion", "").startswith("kyverno.io/"), f"{path}: not a Kyverno resource"
              assert d.get("kind") in ("ClusterPolicy", "Policy"), f"{path}: unexpected kind {d.get('kind')}"
          print(f"{path}: {len(docs)} valid policy document(s)")
          PY
          done

      - name: Check documentation
        run: |
          doc=docs/operations/releases-and-supply-chain.md
          if [ ! -f "$doc" ]; then
            echo "Documentation file missing: $doc"
            exit 1
          fi
          for section in "Overview" "Setup Instructions" "Verification" "Troubleshooting"; do
            if ! grep -q "^## $section" "$doc"; then
              echo "Missing section in $doc: $section"
              exit 1
            fi
          done
          echo "Documentation has all required sections"

      - name: Validate scripts
        run: |
          for script in scripts/setup-image-signing.sh scripts/validate-image-signing.sh; do
            bash -n "$script"
            if [ ! -x "$script" ]; then
              echo "$script is not executable"
              exit 1
            fi
          done
          echo "All scripts are valid and executable"

      - name: Scan policies for permissive rules
        run: |
          for policy in k8s/policies/*.yaml; do
            if grep -q "allow.*\*" "$policy"; then
              echo "::warning file=$policy::Found wildcard allow rule"
            fi
          done
