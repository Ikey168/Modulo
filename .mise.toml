[tools]
java = "temurin-17"
node = "22"
python = "3.14"

[tasks.check-repository]
description = "Verify tracked content and whitespace integrity"
run = "git diff --check"

[tasks.check-frontend]
description = "Run the passing frontend type, boundary, unit, and production-build gates"
run = [
  "npm run typecheck --workspace=frontend",
  "npm run lint:boundary:ci --workspace=frontend",
  "npm run test:run --workspace=frontend",
  "npm run build:strict --workspace=frontend",
]

[tasks.check-frontend-strict-lint]
description = "Report the repository's existing full ESLint debt (not part of check)"
run = "npm run lint --workspace=frontend"

[tasks.check-backend]
description = "Run the Maven reactor and coverage gate used by CI"
run = "mvn -B verify -Dmaven.test.failure.ignore=false"

[tasks.check-wasm]
description = "Rebuild pinned WASM examples and compare their checked-in fixtures"
run = [
  "npm ci --no-audit --no-fund --prefix examples/wasm-nodes/assemblyscript",
  "npm run build --prefix examples/wasm-nodes/assemblyscript",
  "cargo build --manifest-path examples/wasm-nodes/rust/Cargo.toml --release --target wasm32-unknown-unknown",
  "cmp examples/wasm-nodes/assemblyscript/build/titlecase.wasm backend/src/test/resources/wasm/titlecase.wasm",
  "cmp examples/wasm-nodes/rust/target/wasm32-unknown-unknown/release/modulo_wasm_node_wordstats.wasm backend/src/test/resources/wasm/wordstats.wasm",
]

[tasks.check-infrastructure]
description = "Run the versioned personal-infrastructure structural gate"
run = "python3 scripts/verify-personal-infra.py"

[tasks.check]
description = "Run the common local acceptance gate"
depends = ["check-repository", "check-frontend", "check-backend", "check-wasm", "check-infrastructure"]
